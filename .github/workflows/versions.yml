name: Version Info

env:
  GH_PKG_URL: "https://maven.pkg.github.com/${{ github.repository }}"

on:
  workflow_dispatch:

jobs:
  core:
    name: Get Core Variables
    runs-on: ubuntu-22.04
    outputs:
      coreVersion: ${{steps.coreVersion.outputs.version}}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: 'robotgryphon/compactmachines-core'
          fetch-tags: true
          fetch-depth: 0

      - name: Version
        id: version
        uses: paulhatch/semantic-version@v5.0.2
        with:
          version_format: "${major}.${minor}.${patch}"
          search_commit_body: true

  main:
    name: Get Main Variables
    runs-on: ubuntu-22.04
    outputs:
      version: ${{steps.version.outputs.version}}
      coreVersion: ${{steps.coreVersion.outputs.version}}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-tags: true
          fetch-depth: 0

      - name: Version
        id: version
        uses: paulhatch/semantic-version@v5.0.2
        with:
          change_path: "neoforge-main"
          version_format: "${major}.${minor}.${patch}.${increment}-nightly"
          search_commit_body: true

  output:
    name: Output Info
    runs-on: ubuntu-20.04
    needs: [ core, main ]
    steps:
      - run: echo "version = ${{needs.main.outputs.version}}; core version = ${{needs.core.outputs.coreVersion}}"